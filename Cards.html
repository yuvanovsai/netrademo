<html>
    <head>
        <title> Netra | Rover Control</title>
        <style>
            body {
                margin: 0;
                min-height: 100vh;
                padding: 20px 20px 20px 20px;
                font-family: Arial, Helvetica, sans-serif;
                background-color: #e5eff8;
                color: #25234d;
            }
            header {
                text-align: center;
                margin-bottom: 40px;
            }
            .brand {
                font-size: 30px;
                font-weight: 800;
                letter-spacing: 2px;
                color: #229a12;
                margin: 0 0 10px 0;
            }
            .subtitle {
                font-size: 18px;
                color: #62a63b;
                margin: 0;
            }
            .cards{
                display:grid;
                grid-template-columns: repeat(3,1fr);
                gap:20px;
            }
            .card {
                background-color: #dad5d5;
                border: 1px solid #230776;
                border-radius: 10px;
                padding: 20px;
                display: flex;
                flex-direction: column;
            }
            .icon {
                width: 50px;
                height: 50px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 30px;
                padding: 0px;
                border-radius: 15%;
                background-color: #a96567;
            }
            h2 {
                color: #0b0a44;
            }
            .status-text {
                font-weight: bold;
                color: #109426;
            }
            .battery-track{
                height:12px;
                background-color:#96a5e6;
                border-radius:20px;
                overflow:hidden;
                margin-bottom: 20px;
            }
            .battery-fill{
                width:100%;
                height:100%;
                background-color:#249e41;
                transition: width 0.3s ease-in-out;
            }
            button {
                background-color: #1d2664;
                color: white;
                border: none;
                padding: 10px 20px;
                border-radius: 5px;
                cursor: pointer;
            }
            button:hover {
                background-color: #4b50af;
            } 
        </style>
        <!-- Inline JavaScript for Battery Run Operation -->
        <script>
            let battery;
            battery = 100; // Initial battery percentage
            function batteryDemo()
            {
                if (battery >0)
                {
                    battery = battery - 10; // Decrease battery by 10%
                    document.getElementById("batteryBar").style.width = battery + "%"; // Update battery bar width
                    document.getElementById("batteryStatus").textContent=battery + "%"; // Update battery status text
                }
                else
                {
                    alert("Battery is empty! Please recharge.");
                }
            }
        </script>
        <!-- importing the external script -->
        <script src="netra.js"></script>
    </head>
    <body>
        <main>
            <header>
                <h1 class="brand">NETRA</h1>
                <p class="subtitle">Campus Rover Control</p>
            </header>
            <div class="cards">
                <section class="card">
                    <div class="icon" aria-hidden="true">🚀</div>
                    <h2>Rover Deployment</h2>
                    <p class="status">Status: <span class="status-text" id="roverStatus">Standby</span></p>
                   <!--Implementation of Inline javascript-->
                    <button onclick="document.getElementById('roverStatus').textContent = 'Deployed'">Deploy Rover</button>
                </section>
                <section class="card">
                    <div class="icon" aria-hidden="true">🔋</div>
                    <h2>Battery Status</h2>
                    <p class="status">Battery: <span class="status-text" id="batteryStatus">200%</span></p>
                    <div class="battery-track" role="progressbar" aria-label="Battery level" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100%" id="batteryProgress">
                        <div class="battery-fill" id="batteryBar">
                        </div>
                    </div>
                    <button onclick="batteryDemo()">Run Oper</button>
                </section>
                <section class="card">
                    <div class="icon" aria-hidden="true">📡</div>
                    <h2>Campus Scanner</h2>
                    <p class="status" id="scanStatus">Status: Ready</p>
                    <button onclick="scanCampus()">Scan Campus</button>
            </section>
            </div>
        </main>
    </body>
</html>
